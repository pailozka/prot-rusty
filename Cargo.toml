[package]
name = "prot-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
eframe  = "0.27"
egui    = "0.27"
egui_plot = "0.27"
hf-hub = { version = "0.4", features = ["tokio"] }
rayon = "1.12.0"
rfd     = "0.14"   # native file dialog, async-capable
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto       = "thin"   # full LTO needs several GB of RAM to link
